<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グラップルガーデン | AI Games</title><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="./game.css"></head><body><div id="game-shell"></div><main class="game-layout"><section class="game-panel" aria-label="グラップルガーデン"><div class="game-toolbar"><div class="stat"><span class="stat-label">SCORE</span><strong id="score" class="stat-value">0</strong></div><div class="stat"><span class="stat-label">BEST</span><strong id="best" class="stat-value">0</strong></div><div class="toolbar-actions"><button id="start" class="button button-primary">開始</button><button id="pause" class="button" disabled>一時停止</button><button id="reset" class="button">リセット</button></div></div><p id="meter" class="meter"></p><canvas id="game" width="720" height="460" tabindex="0" role="img" aria-label="←→で揺れ、逆入力で減速。距離200px・速度220以下でSpace。左右と往復の4庭を渡ろう。">Canvas対応ブラウザを使用してください。</canvas><p id="status" class="status-text" role="status" aria-live="polite">←→で揺れ、逆入力で減速。距離200px・速度220以下でSpace。左右と往復の4庭を渡ろう。</p><div class="touch-controls"><button class="button" data-action="0">← スイング</button><button class="button" data-action="1">→ スイング</button><button class="button" data-action="2">次のフック</button></div></section></main><script type="module" src="./game.js"></script></body></html>
