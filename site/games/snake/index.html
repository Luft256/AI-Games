<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f0"><title>ネオンスネーク | AI Games</title><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="./game.css"></head><body><div id="game-shell"></div><main class="game-layout"><section class="game-panel" aria-label="ネオンスネークのゲーム">
<div class="game-toolbar"><div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value" id="score">0</strong></div><div class="stat"><span class="stat-label">BEST</span><strong class="stat-value" id="best">0</strong></div><div class="stat"><span class="stat-label">LENGTH</span><strong class="stat-value" id="length">3</strong></div><div class="toolbar-actions"><button class="button button-primary" id="start">スタート</button><button class="button" id="restart">リセット</button></div></div>
<div class="board-wrap"><canvas id="board" width="600" height="600" tabindex="0" aria-label="スネークの盤面。矢印キーまたはWASDで方向を変えます。"></canvas><div class="board-overlay" id="overlay"><span class="eyebrow">FOLLOW YOUR INSTINCT</span><h2 id="overlay-title">ひと口ずつ、長くなる。</h2><p id="overlay-copy">光るフードを集めよう。壁と自分の体には気をつけて。</p><button id="overlay-start" class="button button-primary">プレイする →</button></div></div><p class="status-text" id="status" role="status" aria-live="polite">スタートを押すと始まります。</p>
<div class="touch-controls" aria-label="方向コントロール"><button class="direction up" data-direction="up" aria-label="上に進む">↑</button><button class="direction left" data-direction="left" aria-label="左に進む">←</button><button class="direction down" data-direction="down" aria-label="下に進む">↓</button><button class="direction right" data-direction="right" aria-label="右に進む">→</button></div></section>
<aside class="instructions"><span class="eyebrow">HOW TO PLAY</span><h2>先を読んで、曲がろう。</h2><p>光るフードを食べるたびに10点。体が伸び、少しずつスピードが上がります。壁や自分の体に当たったらゲームオーバー。</p><div class="hint-row"><span class="key">↑ ← ↓ →</span><span>方向を変える · WASDも使えます</span></div><div class="hint-row"><span class="key">SPACE</span><span>開始 / 一時停止 / 再開</span></div><p class="small-note">スマートフォンは方向ボタン、または盤面をスワイプ。反対方向には曲がれません。ベストスコアはこのブラウザに保存されます。</p><div class="mini-art" aria-hidden="true"><span></span><span></span><span></span><span></span><i>✦</i></div></aside></main><script type="module" src="./game.js"></script></body></html>
