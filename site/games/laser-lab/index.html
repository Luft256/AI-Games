<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>レーザーラボ | AI Games</title><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="./game.css"></head><body><div id="game-shell"></div><main class="game-layout"><section class="game-panel"><div class="game-toolbar"><label>部屋 <select id="level" aria-label="部屋を選ぶ"></select></label><div class="stat"><span class="stat-label">手数</span><strong id="moves" class="stat-value">0</strong></div><div class="stat"><span class="stat-label">クリア済み</span><strong id="best" class="stat-value">0</strong></div></div><div id="extra"></div><div id="board" class="board" aria-label="ゲーム盤"></div><p id="status" class="status-text" role="status" aria-live="polite"></p><div class="actions"><button class="button" id="undo">1手戻す</button><button class="button" id="restart">やり直す</button><button class="button" id="pause">一時停止</button><button class="button button-primary" id="next" hidden>次の部屋へ</button></div><p class="instructions">鏡をタップ / Enterで90度回転。矢印キーでマスを選択。全ての受光器に光が届けばクリア。最少目標と部屋ごとのベストに挑戦。予測モードは光路を隠します。</p></section><aside class="note"><span>THINK · TRY · DISCOVER</span><h2>レーザーラボ</h2><p>鏡を回して、光を金色の受光器へ。6つの部屋で反射の道筋を読み解こう。</p><p>部屋ごとにクリアを目指そう。何度でも、すぐにやり直せます。</p><p>1手目から最大30分。停止中・別タブの間も進みます。</p></aside></main><script type="module" src="./game.js"></script></body></html>
