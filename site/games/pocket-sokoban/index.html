<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ポケット倉庫 | AI Games</title><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="./game.css"></head><body><div id="game-shell"></div><main class="game-layout"><section class="game-panel"><div class="game-toolbar"><label>部屋 <select id="level" aria-label="部屋を選ぶ"></select></label><div class="stat"><span class="stat-label">手数</span><strong id="moves" class="stat-value">0</strong></div><div class="stat"><span class="stat-label">クリア済み</span><strong id="best" class="stat-value">0</strong></div></div><div id="extra"></div><div id="board" class="board" aria-label="ゲーム盤"></div><p id="status" class="status-text" role="status" aria-live="polite"></p><div class="actions"><button class="button" id="undo">1手戻す</button><button class="button" id="restart">やり直す</button><button class="button" id="pause">一時停止</button><button class="button button-primary" id="next" hidden>次の部屋へ</button></div><p class="instructions">矢印キー / WASD / 移動ボタンで歩く。箱を押して◎へ。1手戻すで押し間違いを修正。</p></section><aside class="note"><span>THINK · TRY · DISCOVER</span><h2>ポケット倉庫</h2><p>箱は押せても引けない。順番と立ち位置を考えて、すべての箱を金色の置き場へ。</p><p>部屋ごとにクリアを目指そう。何度でも、すぐにやり直せます。</p><p>1手目から最大30分。停止中・別タブの間も進みます。</p></aside></main><script type="module" src="./game.js"></script></body></html>
