<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ギアリンク | AI Games</title><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="./game.css"></head><body><div id="game-shell"></div><main class="game-layout"><section class="game-panel"><div class="game-toolbar"><label>部屋 <select id="level" aria-label="部屋を選ぶ"></select></label><div class="stat"><span class="stat-label">手数</span><strong id="moves" class="stat-value">0</strong></div><div class="stat"><span class="stat-label">クリア済み</span><strong id="best" class="stat-value">0</strong></div></div><div id="extra"></div><div id="board" class="board" aria-label="ゲーム盤"></div><p id="status" class="status-text" role="status" aria-live="polite"></p><div class="actions"><button class="button" id="undo">1手戻す</button><button class="button" id="restart">やり直す</button><button class="button" id="pause">一時停止</button><button class="button button-primary" id="next" hidden>次の部屋へ</button></div><p class="instructions">部品と向きを選び空きマスへ置く。置いた部品をタップすると回転。全ての部品を使い、両端の接続口が合う1本道を作る。</p></section><aside class="note"><span>THINK · TRY · DISCOVER</span><h2>ギアリンク</h2><p>限られた直線と曲がりの部品を置き、動力源から出口まで接続。置く場所も向きも考える配管工房。</p><p>部屋ごとにクリアを目指そう。何度でも、すぐにやり直せます。</p><p>1手目から最大30分。停止中・別タブの間も進みます。</p></aside></main><script type="module" src="./game.js"></script></body></html>
